<!doctype html>
<html lang="ru">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worms revival</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/hud-painted.css" />
    <!-- Fatal error screen: static, self-styled, needs neither fonts nor the app bundle. -->
    <style>
      #fatal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        background: #0b1020;
        color: #e8ecff;
        font:
          16px/1.4 system-ui,
          sans-serif;
      }
      #fatal.show {
        display: flex;
      }
      #fatal .box {
        max-width: 640px;
        max-height: 90%;
        overflow: auto;
        padding: 24px;
        background: #1b1b2a;
        border: 2px solid #ff4a4a;
      }
      #fatal h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      #fatal pre {
        margin: 12px 0;
        padding: 8px;
        max-height: 220px;
        overflow: auto;
        background: #0b1020;
        font-size: 12px;
        white-space: pre-wrap;
        user-select: text;
      }
      #fatal button {
        margin-right: 8px;
        padding: 8px 16px;
        font: inherit;
        cursor: pointer;
      }
      #warn {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 999;
        display: none;
        padding: 6px 12px;
        background: #6b4f00;
        color: #fff;
        font:
          14px system-ui,
          sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="warn"></div>
    <div id="fatal" role="alert">
      <div class="box">
        <h1 id="fatal-title">Ошибка</h1>
        <div id="fatal-msg"></div>
        <pre id="fatal-details"></pre>
        <button id="fatal-copy" type="button">Скопировать подробности</button>
        <button id="fatal-reload" type="button">Перезагрузить</button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
